name: Sync TimeTree calendar

# Keeps Firestore in step with TimeTree so the admin calendar and the public
# availability page reflect real bookings.
#
# TimeTree has no official API (shut down 22 Dec 2023) and no iCal subscription
# feed, so this calls the endpoints TimeTree's own web client uses, via
# scripts/timetree-fetch.mjs. That script is ours - no third-party package sees
# the credentials, and there is no supply chain to trust. It only ever READS;
# nothing here writes back to TimeTree.
#
# Interval: every 5 minutes, the shortest GitHub allows. Two things to know:
#   1. GitHub scheduled workflows are best-effort. Runs are frequently delayed
#      and sometimes skipped under load, so real cadence is more like 5-20 min.
#   2. Each run signs in to TimeTree afresh (~288/day). If exports start
#      failing with auth or rate-limit errors, raise this to '*/15' or '*/30'.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # force a sync from the Actions tab

# Never let a slow run overlap the next scheduled one.
concurrency:
  group: timetree-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch calendar
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_ID: ${{ secrets.TIMETREE_CALENDAR_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TIMETREE_EMAIL:-}" ] || [ -z "${TIMETREE_PASSWORD:-}" ]; then
            echo "::error::Set TIMETREE_EMAIL and TIMETREE_PASSWORD in repo secrets"
            exit 1
          fi
          node scripts/timetree-fetch.mjs --calendar "$TIMETREE_CALENDAR_ID" --out timetree.json
          test -s timetree.json || { echo "::error::fetch produced an empty file"; exit 1; }

      - name: Install Firebase Admin
        run: npm install --no-save --no-audit --no-fund firebase-admin@^13

      - name: Sync into Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BUSINESS_TIMEZONE: Asia/Jakarta
        run: node scripts/sync-timetree.mjs timetree.json

      # Holds real client names - never leave it on the runner.
      - name: Shred the fetched data
        if: always()
        run: rm -f timetree.json
